// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.4.21'
    ext.dokka_version = '2.3.0'
}

plugins {
    id 'com.android.application' version '9.5.3' apply false
    id 'com.android.library' version '9.5.3' apply false
    // AGP 9 has built-in Kotlin; declaring KGP here only upgrades the bundled version.
    id 'org.jetbrains.kotlin.android' version "$kotlin_version" apply false
    id 'com.google.devtools.ksp' version '2.3.14' apply false
    id 'com.diffplug.spotless' version '8.12.0'
    id "org.jetbrains.dokka" version "$dokka_version"
}

subprojects {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        kotlin {
            target '**/*.kt'
            targetExclude "${layout.buildDirectory}/**/*.kt"
            targetExclude 'bin/**/*.kt'

            // The license header is a top-level `/** */` block, which ktlint 1.x flags as a dangling KDoc.
            ktlint().editorConfigOverride(['ktlint_standard_kdoc': 'disabled'])
            licenseHeaderFile rootProject.file('spotless/copyright.kt')
        }

        format('kts') {
            target '**/*.kts'
            targetExclude '**/build/**/*.kts'
            // Look for the first line that doesn't have a block comment (assumed to be the license)
            licenseHeaderFile rootProject.file('spotless/copyright.kts'), '(^(?![\\/ ]\\*).*$)'
        }

        format('xml') {
            target '**/*.xml'
            targetExclude '**/build/**/*.xml'
            // Look for the first XML tag that isn't a comment (<!--) or the xml declaration (<?xml)
            licenseHeaderFile rootProject.file('spotless/copyright.xml'), '(<[^!?])'
        }
    }
}

dependencies {
    dokka(project(':whynotimagecarousel'))
}

dokka {
    moduleName.set("Why Not! Image Carousel!")

    dokkaPublications.html {
        outputDirectory.set(rootProject.file('docs/api'))
        failOnWarning.set(true)
    }

    pluginsConfiguration.html {
        footerMessage.set("Copyright © 2020 Md. Mahmudul Hasan Shohag")
    }
}
